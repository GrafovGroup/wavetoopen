<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" role="img" aria-labelledby="title desc"><title id="title">Touchless activation, illustrated</title><desc id="desc">A hand approaches a wall-mounted wave sensor. The sensor sends an activation request to an automatic door operator. This is a component concept, not a product or installation specification.</desc><defs><linearGradient id="metal" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#f8f8f8"/><stop offset=".5" stop-color="#d7d7d9"/><stop offset="1" stop-color="#f5f5f6"/></linearGradient></defs><rect width="960" height="640" fill="#faf2f3"/><path d="M0 520h960M700 0v640" stroke="#e5d5d9" stroke-width="2"/><text x="55" y="64" fill="#642b37" font-family="Arial" font-size="15" letter-spacing="3">01 / TOUCHLESS ACTIVATION</text><rect x="345" y="115" width="237" height="376" rx="13" fill="#dbc9cf"/><rect x="332" y="102" width="237" height="376" rx="13" fill="url(#metal)" stroke="#aa959c" stroke-width="2"/><circle cx="450" cy="127" r="4" fill="#96878c"/><circle cx="450" cy="452" r="4" fill="#96878c"/><rect x="372" y="155" width="157" height="153" rx="16" fill="#252327"/><circle cx="451" cy="231" r="50" fill="none" stroke="#bd2336" stroke-width="7"/><g fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round"><path d="M430 216q23 15 0 30m13-39q32 24 0 48m14-56q42 31 0 62"/></g><text x="450" y="357" text-anchor="middle" font-family="Arial" font-weight="bold" font-size="22" fill="#252327">WAVE TO OPEN</text><text x="450" y="389" text-anchor="middle" font-family="Arial" font-size="13" fill="#655d60">ILLUSTRATED ACTIVATION DEVICE</text><g fill="none" stroke="#bd2336" stroke-width="3" stroke-linecap="round"><path d="M295 196q-26 32 0 67m-25-84q-38 50 0 100m-28-116q-49 67 0 131"/></g><path d="M20 425l108-75 46-79q14-18 29-8 12 9 5 24l-28 55 64-23q17-5 25 9 7 15-9 24l-21 12 17-2q17 0 21 13 2 13-12 19l-39 15q18 2 18 15-1 11-15 17l-62 26-95 77" fill="#e5c3bc" stroke="#9c6c67" stroke-width="3"/><path d="M610 224h90m-10-9 10 9-10 9" fill="none" stroke="#bd2336" stroke-width="3"/><g font-family="Arial" fill="#642b37"><text x="730" y="218" font-size="19">Activation</text><text x="730" y="245" font-size="19">request</text><text x="730" y="282" font-size="14">To the assessed</text><text x="730" y="304" font-size="14">operator / control</text><text x="730" y="326" font-size="14">arrangement</text><text x="55" y="580" font-size="18">A wave requests opening. The operator moves the door.</text><text x="55" y="609" font-size="12" letter-spacing="1">CONCEPT ILLUSTRATION · NOT A PRODUCT SPECIFICATION</text></g></svg>
